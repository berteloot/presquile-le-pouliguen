services:
  - type: web
    name: presquile-le-pouliguen
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(self), payment=(), usb=()
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; base-uri 'self'; object-src 'none';
          frame-ancestors 'self' https://translate.google.com
          https://*.translate.goog https://translate.googleapis.com; script-src 'self' 'unsafe-inline'
          https://www.googletagmanager.com https://www.google-analytics.com
          https://translate.google.com https://translate.googleapis.com
          https://www.gstatic.com;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com data:; img-src 'self'
          data: blob: https:; connect-src 'self' https://api.open-meteo.com
          https://marine-api.open-meteo.com https://proxy.transport.data.gouv.fr
          https://data.capatlantique.fr https://data.loire-atlantique.fr
          https://www.google-analytics.com https://region1.google-analytics.com
          https://analytics.google.com https://translate.googleapis.com
          https://translate.google.com https://translate-pa.googleapis.com;
          frame-src 'self' https://translate.google.com; manifest-src 'self';
          worker-src 'self' blob:

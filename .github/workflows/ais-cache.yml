name: AIS Offshore Cache

on:
  schedule:
    # Every commit here lands on main, and main auto-deploys, so each refresh
    # costs a full npm ci plus vite build on Render. At the old */30 that was up
    # to 48 builds a day for ship positions in a bay that is watched from a
    # promenade. Two hours keeps the panel current at a twelfth of the build
    # spend. Raise it back if the ships feel stale, the cost is build minutes.
    - cron: "37 */2 * * *"
  workflow_dispatch:

concurrency:
  group: ais-offshore-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job installs npm dependencies and scrapes third-party sites.
          # Without this, checkout leaves the push token in .git/config for the
          # whole job, readable by anything that runs. The token is handed to the
          # commit step alone, which runs no third-party code.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Refresh AIS cache
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AISSTREAM_SECONDS: "360"
          VESSELAPI_KEY: ${{ secrets.VESSELAPI_KEY }}
          VESSELAPI_MIN_HOURS: "12"
        run: |
          if [ -z "$AISSTREAM_API_KEY" ] && [ -z "$VESSELAPI_KEY" ]; then
            echo "AIS secrets are missing; skipping AIS cache refresh."
            exit 0
          fi
          node tools/build_ais_cache.mjs

      - name: Verify build
        working-directory: web
        run: |
          npm run lint
          npm run build

      - name: Commit cache update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- web/public/data/offshore-ships.json; then
            echo "AIS offshore cache unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url --push origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add web/public/data/offshore-ships.json
          git commit -m "Refresh AIS offshore cache"

          # Two attempts. A genuine race with another cache job clears on the
          # retry; anything else fails the run rather than exiting green, because
          # a silently skipped push means a cache that never updates again.
          for attempt in 1 2; do
            git fetch origin main
            # Rebase onto the fetched ref rather than pulling, which works
            # whether or not checkout left HEAD on a branch.
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "Rebase onto origin/main failed on attempt $attempt."
              continue
            fi
            if git push origin HEAD:main; then
              echo "Pushed AIS offshore cache on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt."
          done
          echo "Could not push the AIS offshore cache after 2 attempts."
          exit 1

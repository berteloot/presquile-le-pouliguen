name: Padel Events Cache

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: padel-events-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refresh Padel La Baule cache
        run: node tools/build_padel_events.mjs

      - name: Verify build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit cache update
        run: |
          if git diff --quiet -- web/public/data/padel-events.json; then
            echo "Padel cache unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/padel-events.json
          git commit -m "Refresh Padel La Baule cache"
          if ! git pull --rebase origin main; then
            echo "Remote main changed while the padel cache was refreshing; skipping this cache commit."
            git rebase --abort || true
            exit 0
          fi
          if ! git push; then
            echo "Remote main changed again while pushing; skipping this cache commit."
            exit 0
          fi

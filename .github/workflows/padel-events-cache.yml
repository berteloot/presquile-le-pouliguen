name: Padel Events Cache

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: padel-events-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job installs npm dependencies and scrapes third-party sites.
          # Without this, checkout leaves the push token in .git/config for the
          # whole job, readable by anything that runs. The token is handed to the
          # commit step alone, which runs no third-party code.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refresh Padel La Baule cache
        run: node tools/build_padel_events.mjs

      - name: Verify build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit cache update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- web/public/data/padel-events.json; then
            echo "Padel La Baule cache unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url --push origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add web/public/data/padel-events.json
          git commit -m "Refresh Padel La Baule cache"

          # Two attempts. A genuine race with another cache job clears on the
          # retry; anything else fails the run rather than exiting green, because
          # a silently skipped push means a cache that never updates again.
          for attempt in 1 2; do
            git fetch origin main
            # Rebase onto the fetched ref rather than pulling, which works
            # whether or not checkout left HEAD on a branch.
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "Rebase onto origin/main failed on attempt $attempt."
              continue
            fi
            if git push origin HEAD:main; then
              echo "Pushed Padel La Baule cache on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt."
          done
          echo "Could not push the Padel La Baule cache after 2 attempts."
          exit 1

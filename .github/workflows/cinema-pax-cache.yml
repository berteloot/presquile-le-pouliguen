name: Cinema Pax Cache

on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "17 18,21 * * 2"
    - cron: "17 6,9 * * 3"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh cinema cache
        run: python3 tools/build_local_data.py cinema

      - name: Commit cache update
        run: |
          if git diff --quiet -- web/public/data/cinema-pax.json; then
            echo "Cinema cache unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/cinema-pax.json
          git commit -m "Refresh Cinema Pax cache"
          git push

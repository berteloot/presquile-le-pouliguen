name: Cinema Pax Cache

on:
  schedule:
    # Offset from the padel refresh, which used to share this minute. Both push
    # to main, and two pushes in the same second means one loses the race.
    - cron: "07 */6 * * *"
    - cron: "07 18,21 * * 2"
    - cron: "07 6,9 * * 3"
  workflow_dispatch:

concurrency:
  group: cinema-pax-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh cinema cache
        run: python3 tools/build_local_data.py cinema

      - name: Commit cache update
        run: |
          if git diff --quiet -- web/public/data/cinema-pax.json; then
            echo "Cinema cache unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/cinema-pax.json
          git commit -m "Refresh Cinema Pax cache"
          if ! git pull --rebase origin main; then
            echo "Remote main changed while the cinema cache was refreshing; skipping this cache commit."
            git rebase --abort || true
            exit 0
          fi
          if ! git push; then
            echo "Remote main changed again while pushing; skipping this cache commit."
            exit 0
          fi

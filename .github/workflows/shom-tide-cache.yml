name: SHOM Tide Cache

on:
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:

concurrency:
  group: shom-tide-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Refresh SHOM tide cache
        env:
          SHOM_ACCESS_KEY: ${{ secrets.SHOM_ACCESS_KEY }}
          SHOM_USERNAME: ${{ secrets.SHOM_USERNAME }}
          SHOM_PASSWORD: ${{ secrets.SHOM_PASSWORD }}
          SHOM_HARBOR: LE_POULIGUEN
          SHOM_HARBOR_NAME: Le Pouliguen
          SHOM_DURATION_DAYS: "7"
        run: node tools/build_shom_tide_cache.mjs

      - name: Verify build
        working-directory: web
        run: |
          npm run lint
          npm run build

      - name: Commit cache update
        run: |
          if git diff --quiet -- web/public/data/shom-tides.json; then
            echo "SHOM tide cache unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/shom-tides.json
          git commit -m "Refresh SHOM tide cache"
          git push

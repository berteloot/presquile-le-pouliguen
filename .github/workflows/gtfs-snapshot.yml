name: GTFS Snapshots

on:
  schedule:
    # Weekly. Transdev and SNCF republish a few times a year, and the site
    # monitor fails the snapshot once it passes 744 h, so a monthly job would
    # leave the alert firing for days before the refresh lands.
    - cron: "47 3 * * 1"
  workflow_dispatch:

concurrency:
  group: gtfs-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh bus GTFS snapshot
        run: python3 tools/build_transit_data.py

      - name: Refresh train GTFS snapshot
        run: python3 tools/build_local_data.py trains

      - name: Commit snapshot update
        run: |
          FILES="web/public/data/transit.json web/public/data/trains.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Refresh GTFS snapshots"
          if ! git pull --rebase origin main; then
            echo "Remote main changed while the snapshots were refreshing; skipping this commit."
            git rebase --abort || true
            exit 0
          fi
          if ! git push; then
            echo "Remote main changed again while pushing; skipping this commit."
            exit 0
          fi
